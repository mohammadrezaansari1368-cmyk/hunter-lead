<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>رادار Hunter lead</title><link rel="stylesheet" href="style.css"></head>
<body>
<header>
  <h1>رادار <b>Hunter lead</b> <small>رشت / گیلان</small></h1>
  <div id="status"></div>
  <button id="scan">شروع اسکن</button>
</header>
<main>
  <section id="radar">
    <svg id="map" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet" aria-label="نقشه شماتیک گیلان">
      <defs>
        <radialGradient id="glow"><stop offset="0" stop-color="#FCBF00" stop-opacity=".35"/><stop offset="1" stop-color="#FCBF00" stop-opacity="0"/></radialGradient>
        <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FCBF00" stop-opacity="0"/><stop offset="1" stop-color="#FCBF00" stop-opacity=".45"/></linearGradient>
      </defs>
      <g id="geo"></g>
      <g id="rings"></g>
      <g id="sweep"><path id="beamPath" fill="url(#beam)"/></g>
      <g id="dots"></g>
    </svg>
    <div id="empty" hidden>هنوز داده‌ای نیست — «شروع اسکن» را بزنید.</div>
    <ul id="legend"></ul>
    <ol id="progress"></ol>
  </section>
  <aside>
    <h2>مراحل</h2><ol id="stepper"></ol>
    <h2>کسب‌وکارها <span id="count"></span></h2><div id="list"></div>
    <h2>صف پیام بله <small>(فقط پیش‌نمایش — ارسال نمی‌شود)</small></h2><div id="queue"></div>
  </aside>
</main>
<script src="app.js"></script>
</body></html>
